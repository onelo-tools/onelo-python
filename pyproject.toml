[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "onelo"
dynamic = ["version"]
description = "Onelo SDK for Python — backend feature gating with real-time updates"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Onelo Tools" }]
keywords = ["feature-flags", "feature-gating", "sse", "real-time"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "httpx-sse>=0.4",
]

[project.optional-dependencies]
fastapi = [
    "fastapi >= 0.100",
    "pydantic >= 2.0",
]
flask = [
    "flask >= 2.0",
]
django = [
    "django >= 4.0",
    "djangorestframework >= 3.14",
]
litestar = [
    "litestar >= 2.0",
]
# asgi/wsgi middleware: no extras needed (pure stdlib + httpx which is hard dep)

# The SDK's OWN test environment. It used to have none: the suite was run from
# `backend/venv`, which pins httpx==0.27.2 — the very bottom of the range
# declared above. So `httpx>=0.27,<1.0` was only ever exercised at one point,
# and two assertions silently encoded "httpx >= 0.28" (0.28 changed
# `encode_json` to compact separators, so a byte-substring assertion passed
# there and failed on 0.27.2). See docs/adr/0006 and #100.
#
# httpx is deliberately NOT pinned here — the whole point is that the pin comes
# from the CI matrix (floor and ceiling), not from this file.
dev = [
    "pytest == 9.0.3",
    "pytest-asyncio == 1.3.0",
    "requests >= 2.31",  # tests/test_monitor_autoinstr.py auto-instrumentation
    "onelo[fastapi,flask,django,litestar]",
]

[project.urls]
Homepage = "https://onelo.tools"
Source = "https://github.com/onelo-tools/onelo-python"

[tool.hatch.version]
path = "src/onelo/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/onelo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

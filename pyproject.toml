[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "onelo"
dynamic = ["version"]
description = "Onelo SDK for Python — backend feature gating with real-time updates"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Onelo Tools" }]
keywords = ["feature-flags", "feature-gating", "sse", "real-time"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "httpx-sse>=0.4",
]

[project.optional-dependencies]
fastapi = [
    "fastapi >= 0.100",
    "pydantic >= 2.0",
]
flask = [
    "flask >= 2.0",
]
django = [
    "django >= 4.0",
    "djangorestframework >= 3.14",
]
litestar = [
    "litestar >= 2.0",
]
# asgi/wsgi middleware: no extras needed (pure stdlib + httpx which is hard dep)

[project.urls]
Homepage = "https://app.onelo.tools"
Source = "https://github.com/onelo-tools/onelo-python"

[tool.hatch.version]
path = "src/onelo/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/onelo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
